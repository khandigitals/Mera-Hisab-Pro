<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mera Hisab Pro" />
  <title>Mera Hisab Pro — Complete Business & Personal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       DESIGN SYSTEM TOKENS (Apple HIG + Material Design 3 Fintech Mobile Theme)
       ========================================================================== */
    :root {
      --bg: #F4F7FA;
      --surface: #FFFFFF;
      --surface-soft: #F8FAFC;
      --text: #0F172A;
      --muted: #64748B;
      --border: rgba(15, 23, 42, 0.08);
      --primary: #059669;
      --primary-dark: #047857;
      --primary-soft: #ECFDF5;
      --indigo: #4F46E5;
      --indigo-soft: #EEF2FF;
      --danger: #DC2626;
      --danger-soft: #FEF2F2;
      --warn: #D97706;
      --warn-soft: #FFFBEB;
      --blue: #0284C7;
      --blue-soft: #F0F9FF;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --nav-h: 70px;
      --hdr-h: 64px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100%; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .num { font-variant-numeric: tabular-nums; }
    .c-green { color: var(--primary) !important; }
    .c-red { color: var(--danger) !important; }
    .c-warn { color: var(--warn) !important; }
    .c-blue { color: var(--blue) !important; }
    .c-indigo { color: var(--indigo) !important; }
    .c-muted { color: var(--muted) !important; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.25); border-radius: 99px; }

    /* ==========================================================================
       APP SHELL: FROSTED GLASS HEADER & BOTTOM NAVIGATION
       ========================================================================== */
    .app-header {
      position: sticky; top: 0; z-index: 40;
      height: var(--hdr-h); padding: 0 14px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .hdr-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .hdr-logo {
      width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, #059669 0%, #0D9488 100%);
      color: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }
    .hdr-titles { min-width: 0; }
    .hdr-titles h1 {
      margin: 0; font-size: 0.96rem; font-weight: 800; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-titles p {
      margin: 1px 0 0; font-size: 0.7rem; color: var(--muted); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hdr-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .status-pill {
      font-size: 0.68rem; font-weight: 700; padding: 5px 9px; border-radius: 99px;
      background: var(--primary-soft); color: var(--primary-dark);
      border: 1px solid rgba(5, 150, 105, 0.16);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .icon-btn:active { transform: scale(0.94); background: var(--surface-soft); }

    .app-main {
      max-width: 680px; margin: 0 auto;
      padding: 14px 14px calc(var(--nav-h) + 22px);
    }

    .tab-pane { display: none; animation: fadeIn 0.2s ease; }
    .tab-pane.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      height: var(--nav-h); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.04);
    }
    .nav-btn {
      border: none; background: transparent; color: var(--muted); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px; border-radius: 14px; font-family: inherit;
      font-size: 0.67rem; font-weight: 700; transition: all 0.18s ease;
    }
    .nav-btn .nav-ico {
      width: 36px; height: 26px; border-radius: 99px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s ease;
    }
    .nav-btn.active { color: var(--primary-dark); }
    .nav-btn.active .nav-ico { background: var(--primary-soft); color: var(--primary); }
    .nav-btn:active { transform: scale(0.95); }

    /* ==========================================================================
       CARDS, HERO & GRIDS
       ========================================================================== */
    .card {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 16px; margin-bottom: 14px;
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .card-hdr {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .card-title {
      font-size: 0.92rem; font-weight: 800; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 7px; margin: 0;
    }

    .hero-card {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 55%, #065F46 100%);
      color: #fff; border-radius: 22px; padding: 18px; margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
      position: relative; overflow: hidden;
    }
    .hero-card::after {
      content: ''; position: absolute; right: -40px; top: -40px;
      width: 150px; height: 150px; border-radius: 50%;
      background: rgba(16, 185, 129, 0.16); pointer-events: none;
    }
    .hero-label { font-size: 0.74rem; color: rgba(255, 255, 255, 0.74); font-weight: 600; }
    .hero-val { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; margin: 4px 0 12px; }
    .hero-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .hero-mini { min-width: 0; }
    .hero-mini span { display: block; font-size: 0.66rem; color: rgba(255, 255, 255, 0.68); }
    .hero-mini strong { display: block; font-size: 0.84rem; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

    .wallet-tile {
      background: var(--surface-soft); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px; min-width: 0;
    }
    .wallet-tile .wt-lbl { font-size: 0.72rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .wallet-tile .wt-val { font-size: 1rem; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .stat-box {
      background: var(--surface-soft); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 11px; min-width: 0;
    }
    .stat-box .sb-l { font-size: 0.69rem; color: var(--muted); font-weight: 600; }
    .stat-box .sb-v { font-size: 0.95rem; font-weight: 800; margin-top: 3px; word-break: break-word; }

    /* Quick Action Tiles */
    .qa-btn {
      border: 1px solid var(--border); background: var(--surface-soft);
      border-radius: 15px; padding: 11px 6px; cursor: pointer; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: var(--text); font-size: 0.7rem; font-weight: 700; text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .qa-btn:active { transform: scale(0.96); }
    .qa-ico {
      width: 36px; height: 36px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Banners & Alerts */
    .banner {
      border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      font-size: 0.78rem; font-weight: 600;
    }
    .banner-warn { background: var(--warn-soft); color: #92400E; border: 1px solid rgba(217, 119, 6, 0.22); }
    .banner-danger { background: var(--danger-soft); color: #991B1B; border: 1px solid rgba(220, 38, 38, 0.22); }
    .banner-info { background: var(--blue-soft); color: #075985; border: 1px solid rgba(2, 132, 199, 0.22); }

    /* ==========================================================================
       BUTTONS, SEGMENTED CONTROLS & PILLS
       ========================================================================== */
    .btn {
      min-height: 44px; padding: 10px 15px; border-radius: var(--radius-md);
      border: none; cursor: pointer; font-family: inherit; font-size: 0.84rem; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-sm { min-height: 34px; padding: 6px 11px; font-size: 0.74rem; border-radius: 10px; }
    .btn-xs { min-height: 28px; padding: 4px 9px; font-size: 0.7rem; border-radius: 8px; }
    .btn-block { width: 100%; }

    .btn-primary { background: linear-gradient(135deg, #059669 0%, #047857 100%); color: #fff; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25); }
    .btn-indigo { background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%); color: #fff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.24); }
    .btn-danger { background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%); color: #fff; }
    .btn-warn { background: linear-gradient(135deg, #D97706 0%, #B45309 100%); color: #fff; }
    .btn-soft { background: var(--surface-soft); color: var(--text); border: 1px solid var(--border); }
    .btn-soft-green { background: var(--primary-soft); color: var(--primary-dark); border: 1px solid rgba(5, 150, 105, 0.18); }
    .btn-soft-red { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.18); }
    .btn-soft-indigo { background: var(--indigo-soft); color: var(--indigo); border: 1px solid rgba(79, 70, 229, 0.18); }
    .btn-wa { background: #16A34A; color: #fff; }

    .subtabs {
      display: flex; gap: 6px; padding: 5px; background: #E2E8F0;
      border-radius: 14px; margin-bottom: 14px; overflow-x: auto;
    }
    .subtab {
      flex: 1; min-width: max-content; border: none; background: transparent;
      padding: 9px 12px; border-radius: 10px; cursor: pointer; font-family: inherit;
      font-size: 0.78rem; font-weight: 700; color: #475569; transition: all 0.18s ease;
    }
    .subtab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

    .pills-row {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .pill {
      flex-shrink: 0; border: 1px solid var(--border); background: var(--surface);
      padding: 7px 12px; border-radius: 99px; cursor: pointer; font-family: inherit;
      font-size: 0.74rem; font-weight: 700; color: var(--muted); transition: all 0.15s ease;
    }
    .pill.active { background: var(--text); color: #fff; border-color: var(--text); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 99px; font-size: 0.66rem; font-weight: 700;
    }
    .b-green { background: var(--primary-soft); color: var(--primary-dark); }
    .b-red { background: var(--danger-soft); color: var(--danger); }
    .b-warn { background: var(--warn-soft); color: #B45309; }
    .b-blue { background: var(--blue-soft); color: var(--blue); }
    .b-indigo { background: var(--indigo-soft); color: var(--indigo); }
    .b-gray { background: #F1F5F9; color: #475569; }

    /* ==========================================================================
       FORMS & INPUTS
       ========================================================================== */
    .field { margin-bottom: 12px; min-width: 0; }
    .field label {
      display: block; font-size: 0.74rem; font-weight: 700; color: #334155;
      margin-bottom: 5px;
    }
    .input, select.input, textarea.input {
      width: 100%; min-width: 0; max-width: 100%; min-height: 44px; padding: 10px 12px;
      border-radius: 12px; border: 1.5px solid #E2E8F0; background: var(--surface-soft);
      font-family: inherit; font-size: 0.88rem; font-weight: 600; color: var(--text);
      outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .input:focus {
      border-color: var(--primary); background: var(--surface);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.14);
    }
    textarea.input { min-height: 76px; resize: vertical; }
    .check-row {
      display: flex; align-items: center; gap: 9px; padding: 10px 12px;
      background: var(--surface-soft); border: 1px solid var(--border);
      border-radius: 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .check-row input { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; }

    /* ==========================================================================
       LIST ITEMS & TABLES
       ========================================================================== */
    .list-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 13px; margin-bottom: 9px;
      box-shadow: var(--shadow-sm);
    }
    .li-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .li-title { font-size: 0.88rem; font-weight: 800; line-height: 1.3; word-break: break-word; }
    .li-sub { font-size: 0.72rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .li-amt { font-size: 0.96rem; font-weight: 800; text-align: right; white-space: nowrap; }
    .li-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); }

    .empty-state {
      text-align: center; padding: 28px 16px; color: var(--muted);
      background: var(--surface-soft); border: 1px dashed #CBD5E1; border-radius: 16px;
    }
    .empty-state p { margin: 6px 0 0; font-size: 0.8rem; font-weight: 600; }

    .tbl-wrap { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
    table.data-tbl { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
    table.data-tbl th {
      background: #F1F5F9; color: #334155; font-weight: 800; text-align: left;
      padding: 9px 10px; white-space: nowrap; border-bottom: 1px solid var(--border);
    }
    table.data-tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.data-tbl tr:last-child td { border-bottom: none; }
    .ta-r { text-align: right !important; }

    /* Product Picker Grid */
    .prod-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-height: 240px; overflow-y: auto; padding: 2px; }
    .prod-chip {
      border: 1px solid var(--border); background: var(--surface-soft); border-radius: 13px;
      padding: 10px; text-align: left; cursor: pointer; font-family: inherit;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .prod-chip:active { transform: scale(0.97); border-color: var(--primary); }
    .prod-chip .pc-n { font-size: 0.8rem; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prod-chip .pc-m { font-size: 0.69rem; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; gap: 4px; }

    /* ==========================================================================
       BOTTOM-SHEET MODALS & TOAST & PIN OVERLAY
       ========================================================================== */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; animation: fadeBg 0.18s ease; }
    @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet {
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.2);
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
      .modal-sheet { border-radius: 22px; max-height: 86vh; }
    }
    @keyframes slideUp { from { transform: translateY(32px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
    .sheet-handle { width: 42px; height: 4px; border-radius: 99px; background: #CBD5E1; margin: 0 auto 12px; }
    .modal-hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .modal-hdr h3 { margin: 0; font-size: 1rem; font-weight: 800; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px); z-index: 250;
      transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
      background: #0F172A; color: #fff; padding: 11px 16px; border-radius: 14px;
      font-size: 0.8rem; font-weight: 700; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.28);
      transition: all 0.22s ease; max-width: 92vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: #B91C1C; }
    .toast.ok { background: #047857; }
    #confirm-modal { z-index: 200; }

    /* PIN Lock Screen */
    .pin-overlay {
      position: fixed; inset: 0; z-index: 150;
      background: linear-gradient(160deg, #0F172A 0%, #064E3B 100%);
      color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    .pin-overlay.open { display: flex; }
    .pin-dots { display: flex; gap: 14px; margin: 22px 0 28px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); transition: all 0.15s ease; }
    .pin-dot.filled { background: #10B981; border-color: #10B981; transform: scale(1.1); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px; }
    .pin-key {
      height: 62px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.1); color: #fff; font-family: inherit;
      font-size: 1.3rem; font-weight: 800; cursor: pointer;
    }
    .pin-key:active { background: rgba(255,255,255,0.24); transform: scale(0.95); }

    /* Print / PDF Styles */
    #print-area { display: none; }
    @media print {
      body > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; padding: 16px; color: #000; background: #fff; font-size: 12px; }
      #print-area table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      #print-area th, #print-area td { border: 1px solid #cbd5e1; padding: 6px 8px; }
      #print-area .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
      #print-area .stat-box { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; }
      #print-area .ta-r { text-align: right; }
    }
  </style>
</head>
<body>

  <!-- PIN LOCK OVERLAY -->
  <div id="pin-overlay" class="pin-overlay" aria-hidden="true">
    <div style="width:56px;height:56px;border-radius:18px;background:rgba(16,185,129,0.2);display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2 id="pin-shop-title" style="margin:0;font-size:1.2rem;font-weight:800;">Mera Hisab Pro</h2>
    <p id="pin-msg" style="margin:6px 0 0;font-size:0.82rem;color:rgba(255,255,255,0.75);">Apna 4-Hindson ka PIN Darj Karein</p>
    <div class="pin-dots">
      <div class="pin-dot" id="pd-0"></div><div class="pin-dot" id="pd-1"></div>
      <div class="pin-dot" id="pd-2"></div><div class="pin-dot" id="pd-3"></div>
